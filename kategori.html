<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kategori Produk - Pasar Gedongombo</title>

<link rel="stylesheet" href="style.css">

<style>

header{
background:#198754;
color:white;
text-align:center;
padding:20px;
}


.container{

padding:15px;

}



.judul{

background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);

}



.kategori{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;

}



.item{

background:white;
padding:20px;
border-radius:15px;
text-align:center;
font-size:16px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.1);
text-decoration:none;
color:#198754;

}



.item:hover{

background:#198754;
color:white;

}



#hasilProduk{

margin-top:20px;

}



.produk{

background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);

}



.produk img{

width:100%;
height:200px;
object-fit:cover;
border-radius:10px;

}



.harga{

color:red;
font-size:20px;
font-weight:bold;
margin-top:10px;

}



.btn{

display:block;
margin-top:10px;
padding:12px;
background:#198754;
color:white;
text-decoration:none;
text-align:center;
border-radius:10px;

}


</style>

</head>


<body>


<header>

<h2>📂 Kategori Produk</h2>

<p>Pasar Gedongombo</p>

</header>



<div class="container">



<div class="judul">

Pilih kategori produk

</div>




<div class="kategori">


<a class="item" data-kategori="Makanan">
🍚<br>
Makanan
</a>



<a class="item" data-kategori="Minuman">
🥤<br>
Minuman
</a>



<a class="item" data-kategori="Pertanian">
🌱<br>
Pertanian
</a>



<a class="item" data-kategori="Peternakan">
🐄<br>
Peternakan
</a>



<a class="item" data-kategori="Perikanan">
🐟<br>
Perikanan
</a>



<a class="item" data-kategori="Fashion">
👕<br>
Fashion
</a>



<a class="item" data-kategori="Kerajinan">
🛠<br>
Kerajinan
</a>



<a class="item" data-kategori="Jasa">
🔧<br>
Jasa
</a>



</div>




<div id="hasilProduk">


</div>



</div>



<script type="module" src="navbar.js"></script>

<script src="app.js"></script>

<script type="module" src="kategori.js"></script>


</body>

</html>
