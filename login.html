<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Pasar Gedongombo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

.header{
background:#198754;
color:white;
padding:25px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:14px;
margin-top:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#198754;
color:white;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
}

button:hover{
background:#146c43;
}

.link{
text-align:center;
margin-top:20px;
}

.link a{
text-decoration:none;
color:#198754;
font-weight:bold;
}

.kembali{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#198754;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<h1>🔐 Login</h1>

<p>Pasar Gedongombo</p>

</div>

<div class="container">

<div class="card">

<input 
type="email" 
id="email"
placeholder="Email">


<input 
type="password" 
id="password"
placeholder="Password">


<button id="masuk">
Masuk
</button>

<div class="link">

Belum punya akun?

<br><br>

<a href="daftar.html">

Daftar Sekarang

</a>

<br><br>

<a href="#">

Lupa Password

</a>

</div>

<a class="kembali" href="index.html">

⬅ Kembali ke Beranda

</a>

</div>

</div>
<script type="module" src="login.js"></script>
  
</body>
</html>
