<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Penjual</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#198754;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:18px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:10px;
}

.btn{
display:block;
background:#198754;
color:white;
text-decoration:none;
padding:14px;
text-align:center;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.logout{
background:#dc3545;
}

.info{
color:#666;
font-size:14px;
margin-top:5px;
}
</style>

</head>

<body>

<header>

<h2>Dashboard Penjual</h2>

<p>Selamat datang di Pasar Gedongombo</p>

</header>

<div class="container">

<div class="card">

<h3>🏪 Toko Saya</h3>

<p class="info">Kelola informasi toko Anda.</p>

<a href="profil-toko.html" style="text-decoration:none">

<button>
Edit Profil Toko
</button>

</a>

<div class="card">

<h3>📦 Produk Saya</h3>

<p class="info">Tambah, ubah, atau hapus produk.</p>


<div id="produkSaya">

<p class="info">
Belum ada produk.
</p>

</div>


<a href="tambahproduk.html" class="btn">
+ Tambah Produk
</a>


</div>

<div class="card">

<h3>📊 Statistik</h3>

<p class="info">
Jumlah Produk :
<span id="jumlahProduk">0</span>
</p>

<p class="info">
Produk Terjual : 0
</p>

</div>

<div class="card">

<a href="login.html" class="btn logout">Keluar</a>

</div>

</div>

  <script type="module" src="dashboard.js"></script>
  
</body>
</html>
