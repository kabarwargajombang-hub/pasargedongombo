<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Penjual</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
padding:15px;
}

.card{
background:#fff;
border-radius:18px;
padding:18px;
margin-bottom:18px;
box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.profilHeader{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-align:center;

}

.profilHeader img{
display:block;
margin:auto;
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:5px solid #198754;
background:#eee;
}

.profilHeader h2{
margin-top:12px;
font-size:28px;
color:#198754;
}

.profilHeader p{
margin-top:8px;
font-size:17px;
}

.editBtn{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:#198754;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

.statistik{

display:flex;

gap:15px;

margin-top:20px;

}

.statItem{

flex:1;

background:#f8f9fa;

padding:18px;

border-radius:15px;

text-align:center;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.statItem h3{
font-size:28px;
color:#198754;
margin-bottom:5px;
}

.statItem p{
font-size:15px;
}

#produkSaya{
margin-top:15px;
}

.logout{
background:#dc3545;
}

.logout:hover{
background:#bb2d3b;
}

</style>

</head>

<body>

<header>

<h2>Dashboard Penjual</h2>

<p>Selamat datang di Pasar Gedongombo</p>

</header>

<div class="container">

<!-- PROFIL TOKO -->

<div class="card profilHeader">

<img
id="fotoProfil"
src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

<h2 id="namaToko">
Nama Toko
</h2>

<p>

<b>Pemilik :</b>

<span id="namaPemilik">
-
</span>

</p>

<p>

📍

<span id="lokasiToko">
Gedongombo
</span>

</p>

<a
href="profil-toko.html"
class="editBtn">

✏ Edit Profil

</a>

</div>

<!-- STATISTIK -->

<div class="card">

<h3>📊 Statistik</h3>

<div class="statistik">

<div class="statItem">

<h3 id="jumlahProduk">

0

</h3>

<p>📦 Produk</p>

</div>

<div class="statItem">

<h3 id="totalKlikWA">

0

</h3>

<p>💬 Klik WA</p>

</div>

</div>

<hr style="margin:15px 0;">

<p style="text-align:center;">

🔥 Produk Terlaris

</p>

<h3
id="produkTerlaris"
style="text-align:center;color:#198754;">

Belum ada

</h3>

</div>
  

<!-- PRODUK -->

<div class="card">

<h3>📦 Produk Saya</h3>

<div id="produkSaya">

<p>Belum ada produk.</p>

</div>

</div>

<!-- LOGOUT -->

<div class="card">

<button
id="logout"
class="btn logout">

🚪 Keluar Akun

</button>

</div>

</div>

<script type="module" src="navbar.js"></script>
<script src="app.js"></script>
<script type="module" src="dashboard.js"></script>
<script type="module" src="logout.js"></script>

</body>

</html>
