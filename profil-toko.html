<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil Toko - Pasar Gedongombo</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}


.container{
max-width:450px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}


h2{
text-align:center;
color:#198754;
}


input, textarea{

width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
font-size:16px;

}


textarea{
height:100px;
}


button{

width:100%;
padding:14px;
margin-top:20px;
background:#198754;
color:white;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;

}

a{

display:block;
text-align:center;
margin-top:20px;
color:#198754;
text-decoration:none;

}
  

/* FOTO PROFIL */

.fotoProfilBox{

text-align:center;

margin-bottom:25px;

}

.fotoProfil{

width:130px;

height:130px;

border-radius:50%;

object-fit:cover;

border:5px solid #198754;

background:#eee;

}

#btnFoto{

margin-top:15px;

}

#statusFoto{

margin-top:10px;

font-size:14px;

color:#198754;

font-weight:bold;

}

</style>

</head>


<body>


<div class="container">


<h2>🏪 Profil Toko</h2>
<!-- FOTO PROFIL -->

<div class="fotoProfilBox">

<img
id="previewFoto"
src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
class="fotoProfil">

<input
type="file"
id="fotoProfil"
accept="image/*"
hidden>

<button
type="button"
id="btnFoto"
class="btn">

📷 Ganti Foto Profil

</button>

<p id="statusFoto" class="info">

Belum ada foto profil

</p>

</div>


<input 
type="text"
id="namaToko"
placeholder="Nama Toko">


<input 
type="text"
id="namaPemilik"
placeholder="Nama Pemilik">


<input 
type="number"
id="whatsapp"
placeholder="Nomor WhatsApp">

  <input 
type="text"
id="dusun"
placeholder="Dusun">

<input 
type="text"
id="rtRw"
placeholder="RT/RW">

<input 
type="text"
id="desa"
placeholder="Desa">

<textarea 
id="alamat"
placeholder="Alamat Toko"></textarea>


<textarea
id="deskripsi"
placeholder="Deskripsi Toko"></textarea>



<button id="simpan">

Simpan Profil Toko

</button>



<a href="dashboard.html">

⬅ Kembali Dashboard

</a>


</div>


<script type="module" src="navbar.js"></script>

<script src="app.js"></script>

<script type="module" src="profil-toko.js"></script>


</body>
</html>
