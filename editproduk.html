<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Produk</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#198754;
color:white;
text-align:center;
padding:20px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input,textarea,select{

width:100%;
padding:14px;
margin-top:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;

}

textarea{
height:120px;
resize:none;
}

button{

width:100%;
padding:15px;
margin-top:20px;
background:#198754;
color:white;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;

}

.kembali{

display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#198754;
font-weight:bold;

}

</style>

</head>

<body>

<header>

<h2>✏️ Edit Produk</h2>

<p>Pasar Gedongombo</p>

</header>

<div class="container">

<div class="card">


<!-- FOTO PRODUK -->

<div style="text-align:center;margin-bottom:20px;">


<img
id="previewFoto"
src="https://picsum.photos/300"
style="
width:200px;
height:200px;
object-fit:cover;
border-radius:15px;
border:3px solid #198754;
">


<input
type="file"
id="fotoProduk"
accept="image/*"
hidden>


<button
type="button"
id="btnFoto">

📷 Ganti Foto Produk

</button>


<p
id="statusFoto"
style="
margin-top:10px;
color:#198754;
font-weight:bold;
">

Foto lama

</p>


</div>



<input
type="text"
id="namaProduk"
placeholder="Nama Produk">


<input
type="text"
id="namaProduk"
placeholder="Nama Produk">

<select id="kategori">

<option value="">Pilih Kategori</option>

<option>Makanan</option>

<option>Minuman</option>

<option>Pertanian</option>

<option>Peternakan</option>

<option>Perikanan</option>

<option>Fashion</option>

<option>Kerajinan</option>

<option>Jasa</option>

</select>

<input
type="number"
id="harga"
placeholder="Harga">

<input
type="number"
id="stok"
placeholder="Stok">

<textarea
id="deskripsi"
placeholder="Deskripsi Produk"></textarea>

<button id="updateProduk">

💾 Simpan Perubahan

</button>

<a
class="kembali"
href="dashboard.html">

⬅ Kembali ke Dashboard

</a>

</div>

</div>

<script type="module" src="firebase.js"></script>

<script type="module" src="editproduk.js"></script>

</body>
</html>
