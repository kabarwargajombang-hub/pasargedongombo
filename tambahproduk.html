<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Produk</title>

<link rel="stylesheet" href="style.css">


<style>

.form-container{

padding:20px;

}


.form-card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

}


.form-card input,
.form-card textarea,
.form-card select{

width:100%;

padding:14px;

margin-top:15px;

border:1px solid #ccc;

border-radius:10px;

font-size:16px;

}


.form-card textarea{

height:120px;

resize:none;

}


.form-card button{

width:100%;

padding:15px;

margin-top:20px;

background:#198754;

color:white;

border:none;

border-radius:10px;

font-size:18px;

font-weight:bold;

}


.form-kembali{

display:block;

text-align:center;

margin-top:20px;

text-decoration:none;

color:#198754;

font-weight:bold;

}


</style>

</head>


<body>


<header>

<h2>Tambah Produk</h2>

<p>Pasar Gedongombo</p>

</header>



<div class="form-container">


<div class="form-card">


<input
type="file"
id="fotoProduk"
accept="image/*">



<img
id="previewFoto"
style="
width:100%;
margin-top:15px;
border-radius:10px;
display:none;
">



<input
type="text"
id="namaProduk"
placeholder="Nama Produk">



<select id="kategori">

<option value="">
-- Pilih Kategori --
</option>

<option>Makanan</option>
<option>Minuman</option>
<option>Pertanian</option>
<option>Peternakan</option>
<option>Perikanan</option>
<option>Fashion</option>
<option>Kerajinan</option>
<option>Jasa</option>

</select>




<input
type="number"
id="harga"
placeholder="Harga">



<input
type="number"
id="stok"
placeholder="Stok">



<select id="satuan">

<option>Pcs</option>
<option>Kg</option>
<option>Gram</option>
<option>Liter</option>
<option>Botol</option>
<option>Bungkus</option>

</select>




<textarea
id="deskripsi"
placeholder="Deskripsi Produk"></textarea>




<button id="simpanProduk">

Simpan Produk

</button>




<a class="form-kembali" href="dashboard.html">

⬅ Kembali ke Dashboard

</a>



</div>

</div>




<script type="module" src="navbar.js"></script>

<script src="app.js"></script>

<script type="module" src="tambahproduk.js"></script>



</body>

</html>
