<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasar Gedongombo</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#198754;
color:white;
padding:18px;
text-align:center;
}

header h1{
font-size:28px;
}

header p{
margin-top:5px;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.menu{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:15px;
}

.menu div{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
font-size:14px;
font-weight:bold;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.produk{
padding:15px;
}

.card{
background:white;
border-radius:15px;
padding:10px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.card img{
width:100%;
border-radius:10px;
}

.card h3{
margin-top:10px;
}

.harga{
color:red;
font-size:20px;
font-weight:bold;
margin:8px 0;
}

.stok{
color:green;
font-weight:bold;
}

.wa{
display:block;
margin-top:12px;
background:#25D366;
color:white;
text-align:center;
padding:12px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

footer{
background:#198754;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}
  .bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#ffffff;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -2px 8px rgba(0,0,0,.15);
}

.bottom-nav a{
text-decoration:none;
color:#198754;
font-size:13px;
font-weight:bold;
text-align:center;
}

body{
padding-bottom:80px;
}
</style>

</head>

<body>

<header>
<h1>🛒 Pasar Gedongombo</h1>
<p>Marketplace UMKM Desa Gedongombo</p>
</header>

<div class="search">
<input
type="text"
id="cariProduk"
placeholder="Cari produk...">
</div>

<div class="menu">

<div class="kategori" data-kategori="Semua">
🏠 Semua
</div>

<div class="kategori" data-kategori="Minuman">
🥤 Minuman
</div>

<div class="kategori" data-kategori="Makanan">
🍚 Makanan
</div>

<div class="kategori" data-kategori="Pertanian">
🌾 Pertanian
</div>

<div class="kategori" data-kategori="Perikanan">
🐟 Perikanan
</div>

<div class="kategori" data-kategori="Jasa">
🛠 Jasa
</div>

</div>
<div class="produk" id="daftarProduk">

</div>

</div>

</div>

<footer class="bottom-nav">

<a href="index.html">
🏠<br>
Beranda
</a>


<a href="#kategori">
📂<br>
Kategori
</a>


<a href="#" id="menuJual">
➕<br>
Jual
</a>


<a href="#" id="menuAkun">
👤<br>
Akun
</a>


<a href="tentang.html">
ℹ️<br>
Tentang Kami
</a>


</footer>

  <script type="module" src="produk.js"></script>
  <script type="module" src="menu.js"></script>
  
</body>
</html>
