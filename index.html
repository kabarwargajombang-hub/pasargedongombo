<button id="installBtn">

📱 Install Pasar Gedongombo

</button>






<script>


let deferredPrompt;




window.addEventListener("beforeinstallprompt", function(e){


e.preventDefault();


deferredPrompt = e;



const installBtn = document.getElementById("installBtn");


installBtn.style.display = "block";



});







document.getElementById("installBtn").addEventListener("click", async function(){



if(deferredPrompt){



deferredPrompt.prompt();



const choiceResult = await deferredPrompt.userChoice;



if(choiceResult.outcome === "accepted"){


console.log("Pasar Gedongombo berhasil diinstall");


}



deferredPrompt = null;



document.getElementById("installBtn").style.display = "none";



}



});







window.addEventListener("appinstalled", function(){



console.log("PWA sudah terpasang");



document.getElementById("installBtn").style.display = "none";



});



</script>






<script>

window.addEventListener("load", function () {


navigator.serviceWorker.register("./service-worker.js")


.then(function(registration){


console.log("PWA berhasil", registration.scope);


})


.catch(function(error){


console.log("PWA gagal", error);


});


});


}



</script>
