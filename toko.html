<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Toko - Pasar Gedongombo</title>


<link rel="stylesheet" href="style.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f5f5f5;

}



header{

background:#198754;

color:white;

padding:20px;

text-align:center;

}



header h2{

font-size:24px;

margin-bottom:8px;

}



header p{

font-size:14px;

}





.container{

padding:15px;

}





.info-toko{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

margin-bottom:20px;

}





.info-toko h2{

color:#198754;

font-size:22px;

margin-bottom:12px;

}



.info-toko p{

margin-top:8px;

color:#555;

}







#produkToko{

display:flex;

flex-direction:column;

gap:15px;

}






.produk-toko{

background:white;

padding:15px;

border-radius:15px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

min-height:150px;

overflow:hidden;

}







.produk-toko img{

width:120px;

height:120px;

object-fit:cover;

border-radius:12px;

float:left;

margin-right:15px;

}






.produk-toko h3{

font-size:18px;

margin-top:5px;

margin-bottom:8px;

color:#333;

}






.harga{

font-size:18px;

font-weight:bold;

color:#e53935;

margin-top:5px;

}






.stok{

font-size:14px;

color:#666;

margin-top:8px;

}






.detail{

display:inline-block;

background:#198754;

color:white;

padding:10px 15px;

border-radius:20px;

text-decoration:none;

font-size:14px;

margin-top:12px;

margin-right:5px;

}





.wa{

display:inline-block;

background:#25D366;

color:white;

padding:10px 15px;

border-radius:20px;

text-decoration:none;

font-size:14px;

margin-top:12px;

}






</style>


</head>



<body>



<header>


<h2>

🛒 Toko Gedongombo

</h2>


<p>

Daftar produk UMKM warga

</p>


</header>






<div class="container">



<div class="info-toko">



<h2 id="namaToko">

🏪 Nama Toko

</h2>



<p id="pemilik">

👤 Pemilik

</p>



<p id="whatsapp">

📱 WhatsApp

</p>



<p id="jumlahProduk">

📦 Jumlah Produk: 0

</p>



</div>







<div id="produkToko">



<p>

Memuat produk...

</p>



</div>





</div>






<script type="module" src="navbar.js"></script>


<script src="app.js"></script>


<script type="module" src="toko.js"></script>



</body>


</html>
