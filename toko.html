<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Toko - Pasar Gedongombo</title>


<link rel="stylesheet" href="style.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f5f5f5;

}



header{

background:#198754;

color:white;

padding:20px;

text-align:center;

}



header h2{

font-size:24px;

margin-bottom:8px;

}



header p{

font-size:14px;

}





.container{

padding:15px;

}





.info-toko{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

margin-bottom:20px;

}





.info-toko h2{

color:#198754;

font-size:22px;

margin-bottom:12px;

}



.info-toko p{

margin-top:8px;

color:#555;

}







#produkToko{

display:flex;

flex-direction:column;

gap:15px;

}






.produk-toko{

background:white;

padding:15px;

border-radius:15px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

min-height:150px;

overflow:hidden;

}







.produk-toko img{

width:120px;

height:120px;

object-fit:cover;

border-radius:12px;

float:left;

margin-right:15px;

}






.produk-toko h3{

font-size:18px;

margin-top:5px;

margin-bottom:8px;

color:#333;

}






.harga{

font-size:18px;

font-weight:bold;

color:#e53935;

margin-top:5px;

}






.stok{

font-size:14px;

color:#666;

margin-top:8px;

}






.detail{

display:inline-block;

background:#198754;

color:white;

padding:10px 15px;

border-radius:20px;

text-decoration:none;

font-size:14px;

margin-top:12px;

margin-right:5px;

}





.wa{

display:inline-block;

background:#25D366;

color:white;

padding:10px 15px;

border-radius:20px;

text-decoration:none;

font-size:14px;

margin-top:12px;

}


/* FOTO PROFIL */

.foto-profil{

width:110px;

height:110px;

border-radius:50%;

object-fit:cover;

display:block;

margin:0 auto 15px;

border:4px solid #198754;

background:#eee;

}

/* ==========================
   TOKO MARKETPLACE STYLE
========================== */


/* GRID PRODUK TOKO */

.grid-produk{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}



/* CARD PRODUK */

.produk-toko{

background:white;

border-radius:15px;

overflow:hidden;

box-shadow:0 2px 10px rgba(0,0,0,.1);

padding:0;

}



/* FOTO PRODUK */

.produk-toko img{

width:100%;

height:150px;

object-fit:cover;

border-radius:0;

float:none;

margin:0;

}



/* ISI PRODUK */

.produk-toko h3{

padding:12px 12px 5px;

font-size:17px;

color:#198754;

}



.produk-toko p{

padding:0 12px;

margin-top:6px;

}



/* HARGA */

.produk-toko .harga{

font-size:18px;

font-weight:bold;

color:#dc3545;

padding:0 12px;

}



/* STOK */

.produk-toko .stok{

font-size:14px;

color:#666;

padding:0 12px;

}



/* BUTTON */

.produk-toko .detail,
.produk-toko .wa{

display:block;

margin:12px;

text-align:center;

}



.produk-toko .detail{

background:#198754;

color:white;

border-radius:10px;

}



.produk-toko .wa{

background:#25D366;

border-radius:10px;

}





/* RESPONSIVE */

@media(max-width:480px){

.grid-produk{

grid-template-columns:repeat(2,1fr);

}


.produk-toko img{

height:120px;

}


}

</style>


</head>



<body>



<header>


<h2>

🛒 Toko Gedongombo

</h2>


<p>

Daftar produk UMKM warga

</p>


</header>






<div class="container">



<div class="info-toko">


<img
id="fotoProfil"
class="foto-profil"
src="https://cdn-icons-png.flaticon.com/512/149/149071.png">


<h2 id="namaToko">

🏪 Nama Toko

</h2>



<p id="pemilik">

👤 Pemilik

</p>



<p id="lokasiToko">

📍 Lokasi Toko

</p>



<p id="jumlahProduk">

📦 Jumlah Produk: 0

</p>



</div>

<p id="whatsapp">

📱 WhatsApp

</p>



<p id="jumlahProduk">

📦 Jumlah Produk: 0

</p>



</div>


<div id="produkToko"
class="grid-produk">


<p>

Memuat produk...

</p>


</div>


</div>






<script type="module" src="navbar.js"></script>


<script src="app.js"></script>


<script type="module" src="toko.js"></script>



</body>


</html>
